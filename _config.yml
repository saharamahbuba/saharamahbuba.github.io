<h2 id="research-interest">Research Interest</h2>

- **Coastal and Marine Environmental Processes:** Understanding environmental processes affecting coastal and marine systems.
- **Marine Geochemistry:** Exploring the transport and transformation of carbon and nutrients in aquatic environments.
- **Contaminant Dynamics:** Studying the movement, persistence, and transformation of contaminants in water systems.
- **Water Quality and Treatment:** Investigating water-quality challenges and appropriate treatment approaches.
- **Wastewater Management:** Exploring sustainable wastewater assessment and management strategies.
- **Microplastic Pollution:** Studying emerging pollutants and their environmental effects in aquatic systems.

