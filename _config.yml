<h2 id="projects">Projects</h2>

### Multipurpose Shopping Complex, Rajdhani Supermarket, Tikatuli

Conducted a literature-based environmental impact assessment for a capstone project by identifying major environmental risks and mitigation considerations using published reports, standards, and prior studies.

### Curve Setting Calculator

Designed and implemented a **MATLAB** application for automated roadway curve analysis. The application calculated standard horizontal and vertical curve parameters from minimal input data using textbook methodologies.

### Landscaping of Garden

Developed the landscape-design component of a collaborative hypothetical garden project, integrating biodiversity-supporting elements to enhance human–nature interaction.

### Environmental and Socioeconomic Effect of Matarbari Coal Power Plant Project

Conducted literature-based research on environmental and socioeconomic impacts and synthesized information from project reports into an academic poster.

