### Undergraduate Thesis

**Title:** A Parametric Study of Strength Reduction in Thin-Walled High-Strength Steel Plates with Bolt Holes Considering Curling Effects

**Supervisor:** Dr. Bashir Ahmed  
Professor, Department of Civil Engineering, BUET

Conducted finite element analysis in **Abaqus/CAE** to investigate how plate thickness affects curling behavior, stress distribution, and failure in bolted thin-walled carbon steel plates.

